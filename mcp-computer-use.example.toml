# Copy to mcp-computer-use.toml (cwd) or %USERPROFILE%\.config\mcp-computer-use\config.toml,
# or point MCP_CU_CONFIG at it. Env vars (MCP_CU_<KEY>, OLLAMA_URL, MODEL) override this file.
ollama_url = "http://127.0.0.1:11435"
model = "gpt-oss:20b"
agent_cu_cmd = "agent-cu"
agent_cu_timeout = 20
max_chars = 2000
max_question_chars = 300
generic_tail_chars = 2000
num_ctx = 4096
temperature = 0
# warm answers take ~12s at ~11 tok/s; keep generous headroom
timeout_base = 30
timeout_per_1k_chars = 4
timeout_min = 20
timeout_max = 90
cold_load_extra = 45
# adaptive: next timeout = max(2 x p90 of the last adaptive_window warm calls, timeout_min) + size term;
# a MODEL_TIMEOUT multiplies the next one by 1.5 until a success. false = the static formula above.
adaptive_timeout = true
adaptive_window = 8
# total wall budget per tool call (window reading + autostart + model); keep it under the host's
# tool timeout (Codex tool_timeout_sec = 120). 0 = no cap.
call_budget_seconds = 110
health_http = false
health_host = "127.0.0.1"
health_port = 8765
snapshot_details = true
# sessions_dir = "C:/Develop/mcp-computer-use/.sessions"
session_ttl_hours = 24
keep_alive_idle = "3m"
keep_alive_session = "10m"
session_active_minutes = 10
min_free_mb = 2048
memory_watch = true
memory_watch_interval = 30
autostart_ollama = true
autostart_timeout = 30
# system_prompt_file = "C:/Develop/mcp-computer-use/my_prompt.md"
